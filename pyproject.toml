[project]
name = "truncation-tell"
version = "0.1.0"
description = "Detecting one-sided tail truncation in preference-data subsets"
readme = "README.md"
authors = [
    { name = "M A Allen Febi", email = "allenabi2614@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "langdetect>=1.0.9",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
